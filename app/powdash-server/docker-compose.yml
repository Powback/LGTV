name: powdash-server
services:
  powdash-server:
    build: .
    container_name: powdash-server
    restart: unless-stopped
    environment:
      - PORT=4321
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.powdash.rule=Host(`powdash.pow`)"
      - "traefik.http.routers.powdash.entrypoints=web"
      - "traefik.http.services.powdash.loadbalancer.server.port=4321"
    networks: [default, traefik]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/health"]
      interval: 30s
      timeout: 5s
networks:
  traefik:
    external: true
