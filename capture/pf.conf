# LG TV transparent MITM — pf rules. Only the TV (192.168.50.143) is affected.
# nat: masquerade the TV's forwarded (non-intercepted) traffic so it reaches the internet.
nat on en0 from 192.168.50.143 to any -> (en0)
# rdr: send the TV's HTTP/HTTPS to the local mitmproxy for interception.
rdr pass on en0 inet proto tcp from 192.168.50.143 to any port {80, 443} -> 127.0.0.1 port 8080
pass
